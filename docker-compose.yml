version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-portal-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=news-portal-secret-key-change-in-production
      - CORS_ORIGIN=http://localhost:8080
      - NODE_ENV=production
    volumes:
      - backend-db:/usr/src/app/data
      - backend-uploads:/usr/src/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news-portal-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
    driver: local
  backend-uploads:
    driver: local
